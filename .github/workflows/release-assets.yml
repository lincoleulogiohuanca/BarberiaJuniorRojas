# Genera ZIPs del tema + juniorrojas-core y los adjunta al Release
name: Release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag del release (ej. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  zip-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}

      - name: Resolver tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install zip
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zip

      - name: Empaquetar tema y plugin
        run: |
          set -euo pipefail
          mkdir -p dist
          ( cd app/public/wp-content/themes && zip -r "$GITHUB_WORKSPACE/dist/yuniorrojastheme.zip" yuniorrojastheme -x "*/.git/*" "*/tests/*" "*/node_modules/*" )
          ( cd app/public/wp-content/plugins && zip -r "$GITHUB_WORKSPACE/dist/juniorrojas-core.zip" juniorrojas-core -x "*/.git/*" )
          ls -lah dist
          unzip -l dist/yuniorrojastheme.zip | head -n 15
          unzip -l dist/juniorrojas-core.zip | head -n 15

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: |
            dist/yuniorrojastheme.zip
            dist/juniorrojas-core.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
