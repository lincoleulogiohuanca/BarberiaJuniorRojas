# Genera ZIPs del tema + juniorrojas-core y los adjunta al Release
name: Release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag del release (ej. v1.0.0). Vacío = latest.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  zip-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolver tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "name=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.tag }}" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            TAG=$(gh release view --json tagName -q .tagName)
            echo "name=$TAG" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Checkout tag (dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: git checkout "refs/tags/${{ steps.tag.outputs.name }}" || git checkout "${{ steps.tag.outputs.name }}"

      - name: Empaquetar tema y plugin
        run: |
          set -e
          mkdir -p dist
          (
            cd app/public/wp-content/themes
            zip -r "$GITHUB_WORKSPACE/dist/yuniorrojastheme.zip" yuniorrojastheme \
              -x "*/.git/*" "*/tests/*" "*/node_modules/*"
          )
          (
            cd app/public/wp-content/plugins
            zip -r "$GITHUB_WORKSPACE/dist/juniorrojas-core.zip" juniorrojas-core \
              -x "*/.git/*"
          )
          ls -la dist
          unzip -l dist/yuniorrojastheme.zip | head -n 20
          unzip -l dist/juniorrojas-core.zip | head -n 20

      - name: Subir assets al Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${{ steps.tag.outputs.name }}"
          # Reemplaza assets si ya existían
          gh release upload "$TAG" \
            dist/yuniorrojastheme.zip \
            dist/juniorrojas-core.zip \
            --clobber
          echo "Assets subidos a release $TAG"
          gh release view "$TAG"
