# Deploy Production → push a main (environment con aprobación manual)
name: Deploy Production

on:
  push:
    branches: [main]
    paths:
      - 'app/public/wp-content/themes/yuniorrojastheme/**'
      - 'app/public/wp-content/plugins/juniorrojas-core/**'
      - '.github/workflows/deploy-production.yml'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Gate: no desplegar si el lint del mismo commit fallaría (re-ejecuta checks)
  php-lint:
    name: php-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: PHP syntax
        run: |
          set -e
          find app/public/wp-content/themes/yuniorrojastheme -name '*.php' -print0 | xargs -0 -n1 php -l
          find app/public/wp-content/plugins/juniorrojas-core -name '*.php' -print0 | xargs -0 -n1 php -l

  deploy:
    name: ftp-production
    needs: php-lint
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Verificar secretos FTP production
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::error::Faltan secretos del environment «production»."
            echo "Settings → Environments → production → Secrets:"
            echo "  FTP_SERVER, FTP_USERNAME, FTP_PASSWORD"
            echo "  FTP_SERVER_DIR_THEME, FTP_SERVER_DIR_PLUGIN (rutas remotas)"
            echo "Nunca pongas llaves Culqi en el Action de deploy (van en wp-config del hosting)."
            exit 1
          fi
          echo "Secretos FTP production OK."

      - name: Deploy tema → production
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./app/public/wp-content/themes/yuniorrojastheme/
          server-dir: ${{ secrets.FTP_SERVER_DIR_THEME || '/public_html/wp-content/themes/yuniorrojastheme/' }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/tests/**
            **/node_modules/**

      - name: Deploy juniorrojas-core → production
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./app/public/wp-content/plugins/juniorrojas-core/
          server-dir: ${{ secrets.FTP_SERVER_DIR_PLUGIN || '/public_html/wp-content/plugins/juniorrojas-core/' }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
