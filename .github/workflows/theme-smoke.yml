# CI: lint PHP/JS structure — gate de merge a main
name: Theme smoke

on:
  push:
    branches: [main, developer]
  pull_request:
    branches: [main, developer]

concurrency:
  group: theme-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-lint:
    name: php-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: PHP syntax check (theme + plugins)
        run: |
          set -e
          find app/public/wp-content/themes/yuniorrojastheme -name '*.php' -print0 | xargs -0 -n1 php -l
          find app/public/wp-content/plugins/juniorrojas-core -name '*.php' -print0 | xargs -0 -n1 php -l
          find app/public/wp-content/plugins/juniorrojas-post-types -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: JS modules present
        run: |
          test -f app/public/wp-content/themes/yuniorrojastheme/js/modules/reservar.js
          test -f app/public/wp-content/themes/yuniorrojastheme/js/modules/header-menu.js
          test -f app/public/wp-content/themes/yuniorrojastheme/js/modules/cuenta.js

      - name: No secrets Culqi hardcodeados
        run: |
          if grep -R "pk_test_AXEwZuPbByAfn7UE" app/public/wp-content/themes/yuniorrojastheme; then
            echo "Llave Culqi de prueba hardcodeada detectada"
            exit 1
          fi
          echo "OK sin semillas hardcodeadas"
